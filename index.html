</head>

</aside>
<main>
<section class="calendar-card">
<header>
    <h1>
        <img src="img/calendario.jpeg" alt="Calendário" class="calendar-icon">
        Calendário
        <small id="heading-month">(Maio 2026)</small>
    </h1>
</header>
    <div class="controls"><button id="prev">‹</button><span id="month">Maio</span><button id="next">›</button>
    <button id="prevYear">‹</button><span id="year">2026</span><button id="nextYear">›</button></div>
  </header>
 <div class="mini-logo">
    <img src="img/Logosimples.png" alt="Logo MedTime">
</div>
  <div class="week"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
  <div class="grid" id="calendar"></div>
</section>
<aside class="tasks">
<h2>
    <img src="img/calendario.jpeg" alt="Tarefas" class="task-icon">
    Tarefas: <span id="date">10/05/2026</span>
</h2>  <div id="task-list">
    <article class="task"><b>✎</b><div><strong>Ibuprofeno</strong><small>400mg</small></div><div class="time"><strong>08:00</strong><small>A cada 8h</small></div></article>
    <article class="task gray"><b>✎</b><div><strong>Vitamina D</strong><small>30 gotas</small></div><div class="time"><strong>10:00</strong><small>A cada 24h</small></div></article>
    <article class="task"><b>✎</b><div><strong>Amoxicilina</strong><small>500mg</small></div><div class="time"><strong>22:00</strong><small>A cada 12h</small></div></article>
  </div>
<button class="add" id="add">
    Adicionar medicamento
    <img src="img/remedio+.jpeg" alt="" class="add-icon">
</button></aside>
</main>
<dialog id="modal"><form id="form"><h2>Adicionar medicamento</h2>
<label>Nome<input id="name" required placeholder="Nome do medicamento"></label>
<label>Dosagem<input id="dose" placeholder="Ex.: 500mg"></label>
<label>Horário<input id="time" type="time" required></label>
<div class="actions"><button type="button" id="cancel">Cancelar</button><button class="save">Adicionar</button></div>
</form></dialog>
<script src="script.js"></script>
</body></html>
