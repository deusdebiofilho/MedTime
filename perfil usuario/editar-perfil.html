
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MedTime - Edição de Perfil</title>

    <link rel="stylesheet" href="editar-perfil.css">
</head>

<body>

    <div class="container">

        <!-- MENU LATERAL -->

        <aside class="sidebar">

            <a href="#" class="voltar">‹</a>

            <div class="logo">
                <img src="../IMG/iconelogotipo.png" alt="Logo MedTime">
            </div>

            <nav class="menu">

                <a href="#">
                    <img src="../IMG/inicio (2).png" alt="">
                    <span>Início</span>
                </a>

                <a href="#">
                    <img src="../IMG/calendario (2).png" alt="">
                    <span>Calendário</span>
                </a>

                <a href="#">
                    <img src="../IMG/rotina (2).png" alt="">
                    <span>Rotina</span>
                </a>

                <a href="#">
                    <img src="../IMG/medicamentos (2).png" alt="">
                    <span>Medicamentos</span>
                </a>

                <a href="#">
                    <img src="../IMG/historico (2).png" alt="">
                    <span>Histórico</span>
                </a>

                <a href="#" class="ativo">
                    <img src="../IMG/iconemenuperfil (2).png" alt="">
                    <span>Perfil</span>
                </a>

                <a href="#">
                    <img src="../IMG/configuracoes (2).png" alt="">
                    <span>Configurações</span>
                </a>

            </nav>

        </aside>


        <!-- CONTEÚDO PRINCIPAL -->

        <main class="conteudo">

            <!-- CABEÇALHO -->

            <header class="cabecalho">

                <div class="titulo-pagina">

                    <h1>Edição de perfil</h1>

                    <p>Gerencie suas informações pessoais</p>

                </div>

                <div class="usuario">

<button class="notificacao" type="button">
    <img src="../IMG/sinoalerta (2).png" alt="Notificações">
</button>
      
                    </button>

                    <img
                        src="../IMG/foto perfil.png"
                        alt="Foto do usuário"
                        class="foto-usuario"
                    >

                    <span class="nome-usuario" id="nomeCabecalho">
                        Usuário
                    </span>

                </div>

            </header>


            <!-- CARTÃO DE PERFIL -->

            <section class="card-perfil">

                <div class="card-titulo">

                    <div class="identificacao">

                        <img
                            src="../IMG/foto perfil.png"
                            alt="Ícone do perfil"
                        >

                        <div>

                            <h2>Meu perfil</h2>

                            <p>Gerencie suas informações pessoais</p>

                        </div>

                    </div>

                    <div>

                        <button
                            type="button"
                            class="btn-foto"
                            id="btnFoto"
                        >
                            Alterar foto
                        </button>

                        <input
                            type="file"
                            id="arquivoFoto"
                            accept="image/*"
                            hidden
                        >

                    </div>

                </div>


                <!-- FORMULÁRIO -->

                <form class="form-perfil" id="formPerfil">

                    <div class="campo">

                        <label for="nome">Nome completo</label>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite seu nome"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="email">E-mail</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="localizacao">Localização</label>

                        <input
                            type="text"
                            id="localizacao"
                            placeholder="Digite sua localização"
                        >

                    </div>


                    <div class="campo">

                        <label for="telefone">Telefone</label>

                        <input
                            type="tel"
                            id="telefone"
                            placeholder="Digite seu telefone"
                        >

                    </div>


                    <div class="campo">

                        <label for="senha">Senha</label>

                        <div class="campo-senha">

                            <input
                                type="password"
                                id="senha"
                                placeholder="********"
                                disabled
                            >

                            <button
                                type="button"
                                class="btn-senha"
                                id="btnSenha"
                            >
                                Alterar senha
                                <span>›</span>
                            </button>

                        </div>

                    </div>


                    <div class="campo-acao">

                        <button
                            type="submit"
                            class="btn-salvar"
                        >
                            Salvar
                        </button>

                        <p class="mensagem" id="mensagem"></p>

                    </div>

                </form>

            </section>


            <!-- SESSÕES ATIVAS -->

            <section class="card-sessoes">

                <div class="titulo-sessoes">

                    <img
                        src="../IMG/configuracoes.png"
                        alt="Ícone de sessões"
                    >

                    <div>

                        <h2>Sessões ativas</h2>

                        <p>Dispositivos conectados à sua conta</p>

                    </div>

                </div>


                <div class="lista-sessoes">

                    <div class="sessao">

                        <div class="icone-dispositivo">
                            <span>▣</span>
                        </div>

                        <div class="informacoes-sessao">

                            <h3>Computador</h3>

                            <p>Dispositivo atual</p>

                        </div>

                    </div>


                    <div class="sessao">

                        <div class="icone-dispositivo">
                            <span>▯</span>
                        </div>

                        <div class="informacoes-sessao">

                            <h3>Celular</h3>

                            <p>Outra sessão</p>

                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- JAVASCRIPT -->

    <script src="editar-perfil.js"></script>

</body>

</html>
