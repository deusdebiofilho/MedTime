<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MedTime - Entrar</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="login-container">

        <!-- Logotipo -->
        <header class="logo">

            <div class="logo-ilustracao">
                <div class="relogio">
                    <span class="marca marca-12"></span>
                    <span class="marca marca-3"></span>
                    <span class="marca marca-6"></span>
                    <span class="marca marca-9"></span>

                    <span class="ponteiro ponteiro-hora"></span>
                    <span class="ponteiro ponteiro-minuto"></span>
                    <span class="centro"></span>
                </div>

                <div class="capsula">
                    <span></span>
                </div>
            </div>

            <h1><span>Med</span><strong>Time</strong></h1>

            <p class="slogan">
                CUIDAR DO SEU TEMPO, É CUIDAR DE VOCÊ
            </p>

        </header>

        <!-- Formulário -->
        <section class="formulario">

            <h2>Bem-Vindo de volta!</h2>

            <p class="descricao">
                Faça login para continuar
            </p>

            <form id="formLogin">

                <!-- E-mail -->
                <div class="campo">

                    <span class="icone">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2"/>
                            <path d="m3 7 9 7 9-7"/>
                        </svg>
                    </span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="E-mail"
                        autocomplete="email"
                        required>

                </div>

                <!-- Senha -->
                <div class="campo">

                    <span class="icone">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="4" y="10" width="16" height="11" rx="2"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                        </svg>
                    </span>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Senha"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="mostrar-senha"
                        onclick="alternarSenha()"
                        aria-label="Mostrar senha">
                        ◉
                    </button>

                </div>

                <div class="opcoes">
                    <a href="recuperar-senha.html">
                        Esqueceu a senha?
                    </a>
                </div>

                <button type="submit" class="botao-entrar">
                    Entrar
                </button>

            </form>

            <!-- Separador -->
            <div class="separador">
                <span>ou continue com</span>
            </div>

            <!-- Login social -->
            <div class="redes-sociais">

                <button
                    type="button"
                    class="botao-social"
                    onclick="loginSocial('Google')">

                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#4285F4"
                            d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.5 9.5 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.9 6.1-15z"/>
                        <path fill="#34A853"
                            d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.2A20 20 0 0 0 24 44z"/>
                        <path fill="#FBBC05"
                            d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.2H5.8a20 20 0 0 0 0 17.6z"/>
                        <path fill="#EA4335"
                            d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 5.9 29.5 4 24 4A20 20 0 0 0 5.8 15.2l6.8 5.2C14.2 15.6 18.7 12 24 12z"/>
                    </svg>

                    Google
                </button>

                <button
                    type="button"
                    class="botao-social"
                    onclick="loginSocial('Apple')">

                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="currentColor"
                            d="M16.7 12.8c0-2.3 1.9-3.4 2-3.5a4.4 4.4 0 0 0-3.5-1.9c-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8a4.8 4.8 0 0 0-4 2.4c-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.7 2.5 3 2.4 1.2-.1 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.1-1.2 2.9-2.5a11 11 0 0 0 1.3-2.8 4.1 4.1 0 0 1-2.4-4zM14.3 5.8A4.3 4.3 0 0 0 15.3 3a4.5 4.5 0 0 0-2.9 1.5 4 4 0 0 0-1 2.7 3.8 3.8 0 0 0 2.9-1.4z"/>
                    </svg>

                    Apple
                </button>

            </div>

            <p class="cadastro">
                Ainda não tem uma conta?
                <a href="index.html">Cadastre-se</a>
            </p>

            <p id="mensagem" role="status"></p>

        </section>

    </main>

    <script>
        function alternarSenha() {
            const campo = document.getElementById("senha");
            const botao = document.querySelector(".mostrar-senha");

            if (campo.type === "password") {
                campo.type = "text";
                botao.textContent = "◎";
                botao.setAttribute("aria-label", "Ocultar senha");
            } else {
                campo.type = "password";
                botao.textContent = "◉";
                botao.setAttribute("aria-label", "Mostrar senha");
            }
        }

        document.getElementById("formLogin")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                document.getElementById("mensagem").textContent =
                    "Interface pronta! Conecte o sistema de autenticação para entrar.";
            });

        function loginSocial(provedor) {
            document.getElementById("mensagem").textContent =
                "O login com " + provedor +
                " precisa ser configurado para funcionar.";
        }
    </script>

</body>
</html>
